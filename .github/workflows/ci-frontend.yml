name: Frontend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [Develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build