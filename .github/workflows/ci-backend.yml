name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [Develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t teadrone-backend ./backend

      - name: Run tests inside the container
        run: docker run --rm teadrone-backend pytest