# Component 4 - maturity-to-spray decision rules.
# Edited from the dashboard Settings page or by hand.
# rate_multiplier and normal_flow_l_min are PLACEHOLDERS until validated with TRI.
mapping:
  young: low
  medium: normal
  mature: high
rate_multiplier:
  low: 0.7
  normal: 1
  high: 1.3
confidence_threshold: 0.6
low_confidence_level: normal
baseline_fixed_level: normal
normal_flow_l_min: 1.6
